function detectLang(){try{let saved=localStorage.getItem('asvPartyLang')||localStorage.getItem('quizLangFix2');if(saved&&LANGS.includes(saved))return saved;let n=(navigator.language||'ja').toLowerCase();if(n.startsWith('zh'))return 'zh';if(n.startsWith('vi'))return 'vi';if(n.startsWith('en'))return 'en';if(n.startsWith('ja'))return 'ja';return 'en'}catch(e){return 'ja'}}
function lang(){try{let s=localStorage.getItem('asvPartyLang');if(s&&LANGS.includes(s))return s;let d=detectLang();localStorage.setItem('asvPartyLang',d);return d}catch(e){return 'ja'}}
function setLang(l){try{localStorage.setItem('asvPartyLang',l);localStorage.setItem('quizLangFix2',l)}catch(e){}document.documentElement.lang=l==='zh'?'zh-Hant':l}
function T(k){let L=lang();return (UI[L]&&UI[L][k])||UI.en[k]||UI.ja[k]||k}
function qText(q){let L=lang();return L==='zh'?q.zh:L==='vi'?q.vi:L==='en'?q.en:q.ja}
function opts(q){let L=lang();return L==='zh'?q.oZ:L==='vi'?q.oV:L==='en'?q.oE:q.oJ}
function aText(q){let L=lang();return L==='zh'?q.aZ:L==='vi'?q.aV:L==='en'?q.aE:q.aJ}
function subText(q){let L=lang();return L==='zh'?q.sZ:L==='vi'?q.sV:L==='en'?q.sE:q.sJ}
function expText(q){let L=lang();return L==='zh'?q.eZ:L==='vi'?q.eV:L==='en'?q.eE:q.eJ}
function hostQText(q){return qText(q)}
function hostOpts(q){return opts(q)}

function onLangChange(l){setLang(l);rerenderCurrent()}
function rerenderCurrent(){if(tool==='picker'){renderPicker();return}if(tool==='bingo'){renderBingo();return}if(role==='host'){if(host.phase==='lobby')renderHostLobby(true);else if(host.phase==='question')renderHostQuestion(true);else if(host.phase==='result')renderHostResult();else if(host.phase==='final')renderHostFinal();else renderQuizHome();return}if(role==='player'){if(player._lastState){lastSig='';onPlayer(player._lastState,true)}else renderPlayerLogin();return}if(window._screen==='quizhome'){renderQuizHome();return}if(window._screen==='manual'){manualRoom();return}renderHome()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1500)}
function makeRoom(){let c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>c[Math.floor(Math.random()*c.length)]).join('')}
function all(){return Object.values(host.players)}
function alive(){return all().filter(p=>!p.eliminated)}
function ranks(){return all().sort((a,b)=>b.score-a.score||a.wrong-b.wrong)}
function ranksTop(n){return ranks().slice(0,n)}

function joinURL(){let u=new URL(location.href);u.search='';u.searchParams.set('mode','player');u.searchParams.set('room',room);return u.toString()}
function shuffleArr(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

window.addEventListener('load',()=>{setLang(lang());let p=new URLSearchParams(location.search);let mode=(p.get('mode')||'').toLowerCase();let rm=p.get('room');let tl=(p.get('tool')||'').toLowerCase();if(rm){role='player';room=rm.toUpperCase();base=PREFIX+'/'+room;tool=null;renderPlayerLogin();return}if(mode==='host'){tool=null;startHost();return}if(mode==='player'){tool=null;manualRoom();return}if(tl==='picker'){openPicker();return}if(tl==='bingo'){openBingo();return}renderHome()});
function connect(cb){if(!window.mqtt){toast(T('mqttError'));return}client=mqtt.connect(BROKER,{clientId:'quiz_'+role+'_'+Math.random().toString(36).slice(2,9),clean:true,reconnectPeriod:2000,connectTimeout:8000});client.on('connect',()=>{if(role==='host')host.connected=true;else player.connected=true;if(cb)cb();updateConn()});client.on('close',()=>{if(role==='host')host.connected=false;else player.connected=false;updateConn()});client.on('message',(t,m)=>{let d;try{d=JSON.parse(m.toString())}catch(e){return}if(role==='host')onHost(d);else onPlayer(d)})}
function updateConn(){document.querySelectorAll('[data-conn]').forEach(el=>{let ok=role==='host'?host.connected:player.connected;el.className='inline-flex items-center gap-2 rounded-full px-4 py-2 font-black '+(ok?'bg-green-400 text-[#001E62]':'bg-red-500 text-white');el.innerHTML=icon(ok?'wifi':'off','w-4 h-4')+(ok?T('connected'):T('reconnecting'))})}

function renderPicker(){window._screen='picker';let names=pickerNames();app.innerHTML='<main class="min-h-screen p-5"><div class="max-w-5xl mx-auto">'+topBar()+'<section class="panel rounded-[2rem] p-7 md:p-10 mt-5 fade"><h1 class="text-4xl md:text-5xl font-black text-[#001E62] mb-3">'+esc(T('pickerTitle'))+'</h1><p class="text-slate-600 font-bold mb-6">'+esc(T('pickerDesc'))+'</p><div class="grid lg:grid-cols-2 gap-6"><div><label class="font-black text-[#001E62]">'+esc(T('namesLabel'))+'</label><textarea id="pickerNames" rows="9" class="w-full mt-2 rounded-2xl border p-4 font-bold text-[#001E62] outline-none" placeholder="'+esc(T('namesPlaceholder'))+'" oninput="picker.namesText=this.value">'+esc(picker.namesText)+'</textarea><div class="flex gap-3 mt-4 flex-wrap"><button onclick="spinPicker()" class="btn rounded-2xl gold px-8 py-4 font-black text-xl" '+(picker.spinning?'disabled':'')+'>'+esc(picker.spinning?T('spinning'):T('spinBtn'))+'</button><button onclick="renderHome()" class="btn rounded-2xl bg-white border px-6 py-4 font-black text-[#001E62]">'+esc(T('backHub'))+'</button></div></div><div class="rounded-3xl bg-[#001E62] text-white p-7 flex flex-col items-center justify-center min-h-[280px] text-center"><p class="font-black opacity-80 mb-3">'+esc(T('winner'))+'</p><p id="pickerDisplay" class="spin-name text-5xl md:text-6xl font-black break-words">'+esc(picker.winner||'—')+'</p>'+(picker.winner&&!picker.spinning?'<button onclick="removePickerWinner()" class="btn mt-6 rounded-full bg-white text-[#001E62] px-5 py-2 font-black">'+esc(T('removeWinner'))+'</button>':'')+'</div></div><div class="mt-7"><div class="flex items-center justify-between"><h2 class="text-2xl font-black text-[#001E62]">'+esc(T('pickerHistory'))+'</h2><button onclick="picker.history=[];renderPicker()" class="btn rounded-full bg-white border px-4 py-2 font-black text-[#001E62]">'+esc(T('clearHistory'))+'</button></div><div class="flex flex-wrap gap-2 mt-3">'+(picker.history.length?picker.history.map((n,i)=>'<span class="rounded-full bg-[#F4F7FF] text-[#001E62] px-4 py-2 font-black">'+(i+1)+'. '+esc(n)+'</span>').join(''):'<span class="text-slate-500 font-bold">—</span>')+'</div></div></section></div></main>'}
function spinPicker(){let names=pickerNames();if(!names.length){alert(T('noNamesAlert'));return}picker.spinning=true;renderPicker();let disp=document.getElementById('pickerDisplay');let ticks=0,total=28+Math.floor(Math.random()*12);let iv=setInterval(()=>{ticks++;let n=names[Math.floor(Math.random()*names.length)];if(disp){disp.textContent=n;disp.style.transform='scale('+(1+Math.random()*0.08)+')'}if(ticks>=total){clearInterval(iv);picker.winner=names[Math.floor(Math.random()*names.length)];picker.history.unshift(picker.winner);picker.spinning=false;renderPicker();try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}}},80)}
function removePickerWinner(){if(!picker.winner)return;let names=pickerNames().filter(n=>n!==picker.winner);picker.namesText=names.join('\n');picker.winner='';renderPicker()}

function renderBingo(){window._screen='bingo';let drawnSet=new Set(bingo.drawn);let cells='';for(let n=1;n<=75;n++){let on=drawnSet.has(n),cur=bingo.current===n;cells+='<div class="bingo-cell '+(cur?'gold ring-4 ring-[#001E62]':on?'blue':'bg-[#F4F7FF] text-[#001E62]')+'">'+n+'</div>'}app.innerHTML='<main class="min-h-screen p-5"><div class="max-w-5xl mx-auto">'+topBar()+'<section class="panel rounded-[2rem] p-7 md:p-10 mt-5 fade"><h1 class="text-4xl md:text-5xl font-black text-[#001E62] mb-3">'+esc(T('bingoTitle'))+'</h1><p class="text-slate-600 font-bold mb-6">'+esc(T('bingoDesc'))+'</p><div class="grid lg:grid-cols-[320px_1fr] gap-6"><div class="rounded-3xl bg-[#001E62] text-white p-7 text-center"><p class="font-black opacity-80">'+esc(T('currentNumber'))+'</p><p class="text-8xl font-black my-4">'+(bingo.current??'—')+'</p><p class="font-bold">'+esc(T('drawnCount'))+': '+bingo.drawn.length+' / 75 · '+esc(T('remaining'))+': '+(75-bingo.drawn.length)+'</p><button onclick="drawBingo()" class="btn mt-6 w-full rounded-2xl gold py-4 font-black text-xl">'+esc(T('drawBtn'))+'</button><button onclick="bingo.drawn=[];bingo.current=null;renderBingo()" class="btn mt-3 w-full rounded-2xl bg-white text-[#001E62] py-3 font-black">'+esc(T('resetBingo'))+'</button><button onclick="renderHome()" class="btn mt-3 w-full rounded-2xl border border-white/40 py-3 font-black">'+esc(T('backHub'))+'</button></div><div><h2 class="text-2xl font-black text-[#001E62] mb-3">'+esc(T('bingoHistory'))+'</h2><div class="grid grid-cols-5 sm:grid-cols-10 gap-2">'+cells+'</div>'+(bingo.drawn.length?'<p class="mt-4 font-bold text-slate-600">'+esc(T('drawnCount'))+': '+bingo.drawn.join(', ')+'</p>':'')+'</div></div></section></div></main>'}

function startHost(){role='host';tool=null;window._screen='host';room=makeRoom();base=PREFIX+'/'+room;host={phase:'lobby',players:{},qi:-1,order:[],answers:{},answerTimes:{},remain:20,result:null,connected:false,endsAt:0,settings:{count:10,shuffle:true,timer:20}};lastLobbySig='';connect(()=>{client.subscribe(base+'/player');renderHostLobby(true);broadcast()})}

function renderHostLobby(force){host.phase='lobby';let sig=all().map(p=>p.id+':'+p.name).join('|')+'#'+JSON.stringify(host.settings);if(!force&&sig===lastLobbySig)return;lastLobbySig=sig;let u=joinURL();hostShell('<section class="grid lg:grid-cols-[420px_1fr] gap-6 h-full"><div class="panel rounded-[2rem] p-7 text-center overflow-auto"><h1 class="text-4xl font-black mb-2 text-[#001E62]">'+esc(T('lobbyTitle'))+'</h1><p class="font-black text-[#001E62] mb-4">'+esc(T('roomId'))+': '+esc(room)+'</p><div id="qrcode" class="bg-white rounded-[2rem] p-4 inline-flex items-center justify-center mb-4 w-[300px] h-[300px] max-w-full border"></div><p class="text-sm text-slate-500 font-bold break-all mb-4">'+esc(u)+'</p><div class="rounded-3xl bg-[#F4F7FF] p-5 mb-2"><p class="text-slate-600 font-bold">'+esc(T('currentPlayers'))+'</p><p class="text-7xl font-black text-[#001E62]">'+all().length+'</p></div>'+settingsHTML()+'<button onclick="startGame()" class="btn pulse w-full rounded-3xl gold py-5 font-black text-3xl mt-5">'+icon('play','w-8 h-8')+' '+esc(T('startGame'))+'</button></div><div class="panel rounded-[2rem] p-7 overflow-auto"><h2 class="text-3xl font-black mb-5 text-[#001E62]">'+esc(T('playerList'))+'</h2><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">'+(all().length?all().map(p=>'<div class="rounded-2xl bg-[#F4F7FF] p-4 font-bold flex justify-between text-[#001E62]"><span>'+esc(p.name)+'</span><span class="text-green-600">'+esc(T('waitingBadge'))+'</span></div>').join(''):'<p class="text-slate-600 text-xl font-bold">'+esc(T('waitingPlayers'))+'</p>')+'</div></div></section>');setTimeout(()=>{let el=document.getElementById('qrcode');if(el&&window.QRCode)new QRCode(el,{text:u,width:280,height:280,colorDark:'#001E62',colorLight:'#fff'})},0)}
function onHost(d){if(d.type==='join'){let old=host.players[d.id]||{};host.players[d.id]={id:d.id,name:String(d.name||T('guest')).slice(0,10),score:old.score||0,wrong:old.wrong||0,streak:old.streak||0,eliminated:!!old.eliminated,lastCorrect:!!old.lastCorrect,lastBase:old.lastBase||0,lastSpeed:old.lastSpeed||0,lastStreakBonus:old.lastStreakBonus||0,lastGain:old.lastGain||0};if(host.phase==='lobby')renderHostLobby(false);broadcast()}if(d.type==='answer'){if(host.phase!=='question')return;let p=host.players[d.id];if(!p||p.eliminated||host.answers[d.id]!==undefined)return;host.answers[d.id]=Number(d.answer);host.answerTimes[d.id]=Date.now();updateHostLive();broadcast();if(Object.keys(host.answers).length>=alive().length)finishQuestion()}}
function state(){let qObj=null;if(host.phase==='question'&&host.order.length)qObj={time:host.settings.timer,endsAt:host.endsAt,qIdx:host.order[host.qi]};return{type:'state',phase:host.phase,roomId:room,questionIndex:host.qi,totalQuestions:host.order.length||host.settings.count,order:host.order,settings:host.settings,question:qObj,result:host.result,players:host.players,ranking:ranks(),maxWrong:MAX_WRONG}}
function broadcast(){pub(base+'/host',state())}
function startGame(){if(!all().length){alert(T('noPlayersAlert'));return}host.order=buildOrder();host.qi=-1;all().forEach(p=>{p.score=0;p.wrong=0;p.streak=0;p.eliminated=false;p.lastCorrect=false;p.lastBase=0;p.lastSpeed=0;p.lastStreakBonus=0;p.lastGain=0});nextQuestion()}
function nextQuestion(){if(host.qi>=host.order.length-1){host.phase='final';renderHostFinal();broadcast();return}host.qi++;host.phase='question';host.answers={};host.answerTimes={};host.result=null;host.remain=host.settings.timer;host.endsAt=Date.now()+host.settings.timer*1000;renderHostQuestion(true);broadcast();startHostTimer()}
function startHostTimer(){clearInterval(hostTimer);cancelAnimationFrame(hostRAF);hostTimer=setInterval(()=>{host.remain=Math.max(0,Math.ceil((host.endsAt-Date.now())/1000));updateHostLive();if(host.remain<=0)finishQuestion()},200);animate('hBar',host.endsAt,host.settings.timer,v=>hostRAF=v)}
function animate(id,ends,total,setter){function tick(){let left=Math.max(0,(ends-Date.now())/(total*1000)),b=document.getElementById(id);if(b){b.style.transform='scaleX('+left+')';b.style.background=left<=.25?'#EF4444':'linear-gradient(90deg,#001E62,#3B82F6)'}if(left>0)setter(requestAnimationFrame(tick))}tick()}
function renderHostQuestion(force){let q=curQ();if(!q)return;hostShell('<section class="panel rounded-[2rem] p-7 h-full overflow-auto"><div class="grid lg:grid-cols-[1fr_230px] gap-5 mb-5"><p class="text-[#001E62] font-black text-2xl">'+esc(T('questionOf'))+' '+(host.qi+1)+' / '+host.order.length+'</p><div class="text-center rounded-[2rem] bg-white text-[#001E62] border px-8 py-4"><p class="font-bold">'+esc(T('timeLeft'))+'</p><p id="hTime" class="text-5xl font-black">'+host.remain+'</p></div></div><div class="barwrap h-4 bg-slate-200 rounded-full mb-6"><div id="hBar" class="bar"></div></div><div class="grid xl:grid-cols-[1fr_330px] gap-6"><div><h1 class="text-4xl md:text-6xl font-black leading-tight mb-7">'+esc(hostQText(q))+'</h1><div class="grid md:grid-cols-2 gap-4">'+hostOpts(q).map((op,i)=>'<div class="rounded-3xl bg-[#F4F7FF] text-[#001E62] p-5 text-2xl md:text-3xl font-black flex gap-4 items-center"><span class="rounded-full bg-[#001E62] text-white w-12 h-12 flex items-center justify-center shrink-0">'+String.fromCharCode(65+i)+'</span>'+esc(op)+'</div>').join('')+'</div></div><aside><div class="rounded-3xl bg-[#F4F7FF] p-7"><p class="text-slate-600 font-bold">'+esc(T('answerStatus'))+'</p><p class="text-6xl font-black text-[#001E62]"><span id="hAnswered">0</span> / <span id="hAlive">'+alive().length+'</span></p></div></aside></div></section>');updateHostLive()}
function updateHostLive(){let a=Object.keys(host.answers).length;let ht=document.getElementById('hTime'),ha=document.getElementById('hAnswered'),hl=document.getElementById('hAlive');if(ht)ht.textContent=host.remain;if(ha)ha.textContent=a;if(hl)hl.textContent=alive().length}
function finishQuestion(){if(host.phase!=='question')return;clearInterval(hostTimer);cancelAnimationFrame(hostRAF);let q=curQ(),counts=[0,0,0,0],voters=[[],[],[],[]];Object.entries(host.answers).forEach(([id,a])=>{if(a>=0&&a<4){counts[a]++;if(host.players[id])voters[a].push(host.players[id].name)}});let totalMs=host.settings.timer*1000;all().forEach(p=>{if(p.eliminated){p.lastCorrect=false;p.lastBase=0;p.lastSpeed=0;p.lastStreakBonus=0;p.lastGain=0;return}let ok=host.answers[p.id]===q.c;p.lastCorrect=ok;if(ok){p.streak=(p.streak||0)+1;let at=host.answerTimes[p.id]||host.endsAt;let ratio=Math.max(0,Math.min(1,(host.endsAt-at)/totalMs));let speed=Math.round(50*ratio);let streakBonus=p.streak>=2?Math.min(50,(p.streak-1)*10):0;let gain=100+speed+streakBonus;p.lastBase=100;p.lastSpeed=speed;p.lastStreakBonus=streakBonus;p.lastGain=gain;p.score+=gain}else{p.streak=0;p.lastBase=0;p.lastSpeed=0;p.lastStreakBonus=0;p.lastGain=0;p.wrong++;if(p.wrong>=MAX_WRONG)p.eliminated=true}});host.phase='result';host.result={questionIndex:host.qi,qIdx:host.order[host.qi],questionText:qText(q),options:opts(q),correct:q.c,correctText:opts(q)[q.c],counts:counts,voters:voters,explain:expText(q),title:aText(q),sub:subText(q),kind:q.k};renderHostResult();broadcast()}
function renderHostResult(){let r=host.result;if(!r)return;hostShell('<section class="grid xl:grid-cols-[1.05fr_.95fr] gap-6 h-full"><div class="panel rounded-[2rem] p-6 overflow-auto"><p class="text-[#001E62] font-black text-2xl mb-2">'+esc(T('correctReveal'))+'</p><h1 class="text-3xl font-black mb-4">'+esc(r.questionText)+'</h1><div class="bg-white rounded-[2rem] p-4 border" style="height:40vh"><canvas id="chart"></canvas></div><div class="grid grid-cols-2 gap-4 mt-4"><div class="rounded-2xl bg-[#F4F7FF] p-4"><p class="font-bold text-slate-600">'+esc(T('alive'))+'</p><p class="text-4xl font-black text-[#001E62]">'+alive().length+'</p></div><div class="rounded-2xl bg-[#F4F7FF] p-4"><p class="font-bold text-slate-600">'+esc(T('eliminatedCount'))+'</p><p class="text-4xl font-black text-[#001E62]">'+all().filter(p=>p.eliminated).length+'</p></div></div></div><div class="panel rounded-[2rem] p-6 flex flex-col overflow-auto"><div class="rounded-[2rem] gold p-5 mb-4"><p class="text-4xl font-black">'+String.fromCharCode(65+r.correct)+'</p><p class="text-2xl font-black">'+esc(r.correctText)+'</p></div>'+visual(r.kind,r.title,r.sub)+'<div class="rounded-3xl bg-[#F4F7FF] p-4 my-4"><p class="text-[#001E62] font-black">'+esc(T('exp'))+'</p><p class="font-bold text-slate-700">'+esc(r.explain)+'</p></div><button onclick="nextQuestion()" class="btn mt-auto rounded-3xl blue py-4 font-black text-2xl">'+esc(host.qi>=host.order.length-1?T('toRanking'):T('nextQuestion'))+'</button></div></section>');setTimeout(drawChart,0)}
function drawChart(){let r=host.result,c=document.getElementById('chart');if(!c||!window.Chart)return;if(chart)chart.destroy();chart=new Chart(c,{type:'bar',data:{labels:r.options.map((o,i)=>String.fromCharCode(65+i)+'. '+o),datasets:[{data:r.counts,backgroundColor:r.options.map((_,i)=>i===r.correct?'#FACC15':'#001E62'),borderRadius:12}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:(ctx)=>{let n=r.voters[ctx.dataIndex]||[];return n.length?T('votersLabel')+': '+n.join(', '):T('noVoters')}}}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}
function podiumHTML(list){let top=list.slice(0,3);if(!top.length)return '';let order=[top[1],top[0],top[2]].filter(Boolean);let heights={0:110,1:160,2:80};let medals=['2','1','3'];let bg=['#E5E7EB','#FACC15','#FDBA74'];let html='<div class="podium mb-8">';[1,0,2].forEach((rankIdx,pos)=>{let p=top[rankIdx];if(!p)return;html+='<div class="col"><p class="font-black text-[#001E62] text-xl mb-2">'+esc(p.name)+'</p><p class="font-black text-[#001E62] text-3xl mb-2">'+p.score+'</p><div class="block" style="height:'+heights[rankIdx]+'px;background:'+bg[rankIdx]+'"><span class="text-4xl">'+medals[rankIdx]+'</span>'+(rankIdx===0?'<span class="text-sm">'+esc(T('champion'))+'</span>':'')+'</div></div>'});return html+'</div>'}
function renderHostFinal(){let list=ranks();hostShell('<section class="panel rounded-[2rem] p-10 text-center h-full overflow-auto"><div class="text-yellow-500 mb-4">'+icon('trophy','w-20 h-20')+'</div><h1 class="text-6xl font-black mb-6 text-[#001E62]">'+esc(T('ranking'))+'</h1>'+podiumHTML(list)+'<div class="max-w-4xl mx-auto space-y-3">'+list.map((p,i)=>'<div class="rounded-[2rem] '+(i===0?'rank1':'rankN')+' p-5 flex justify-between shadow border"><b class="text-2xl">'+(i+1)+'. '+esc(p.name)+'</b><b class="text-4xl">'+p.score+'</b></div>').join('')+'</div><button onclick="renderHome()" class="btn mt-8 rounded-full blue px-8 py-4 font-black text-xl">'+esc(T('backHub'))+'</button></section>')}
function renderPlayerLogin(){window._screen='playerlogin';app.innerHTML='<main class="min-h-screen flex items-center justify-center p-5 safe"><section class="panel rounded-[2rem] p-7 text-center w-full max-w-md"><div class="flex justify-end mb-3">'+langSwitcher()+'</div><img src="'+LOGO+'" class="logo-sm mx-auto mb-6"><p class="text-[#001E62] font-black text-xl mb-1">'+esc(T('roomId'))+': '+esc(room)+'</p><h1 class="text-3xl font-black mb-3 text-[#001E62]">'+esc(T('name'))+'</h1><input id="nickname" maxlength="10" value="'+esc(player.name)+'" class="w-full rounded-2xl p-5 text-[#001E62] font-black text-2xl text-center outline-none mb-5 border" placeholder="'+esc(T('nicknamePlaceholder'))+'"><button onclick="joinPlayer()" class="btn w-full rounded-2xl gold py-5 font-black text-xl">'+esc(T('enter'))+'</button><p id="msg" class="mt-5 text-slate-600 text-sm"></p></section></main>'}
function joinPlayer(){let n=document.getElementById('nickname').value.trim().slice(0,10);if(!n){document.getElementById('msg').textContent=T('nicknameError');return}player.name=n;saveP();lastSig='';connect(()=>{client.subscribe(base+'/host');pub(base+'/player',{type:'join',id:player.id,name:player.name});renderPlayerWaiting(T('joined'))})}
function stateSig(d){try{return [d.phase,d.questionIndex,(d.order||[]).join(','),JSON.stringify(d.settings||{}),d.result?d.result.qIdx:'',Object.values(d.players||{}).map(p=>p.id+':'+p.score+':'+p.wrong+':'+p.eliminated+':'+(p.streak||0)+':'+(p.lastGain||0)).join('|')].join('#')}catch(e){return String(Date.now())}}
function onPlayer(d,force){if(d.type!=='state')return;player._lastState=d;let sig=stateSig(d);if(!force&&sig===lastSig&&d.phase!=='question')return;if(!force&&sig===lastSig&&d.phase==='question'&&player.locked)return;lastSig=sig;let me=d.players&&d.players[player.id];if(me){player.score=me.score;player.wrong=me.wrong;player.streak=me.streak||0;player.eliminated=me.eliminated;player.lastBase=me.lastBase||0;player.lastSpeed=me.lastSpeed||0;player.lastStreakBonus=me.lastStreakBonus||0;player.lastGain=me.lastGain||0;player.lastCorrect=!!me.lastCorrect;saveP()}if(player.eliminated&&d.phase!=='final'){renderPlayerEliminated();return}if(d.phase==='lobby')renderPlayerWaiting(T('joined'));if(d.phase==='question'){if(player.lastQi!==d.questionIndex){player.selected=null;player.locked=false;player.lastQi=d.questionIndex}renderPlayerQuestion(d);startPlayerTimer(d.question.endsAt,d.question.time)}if(d.phase==='result'){renderPlayerResult(d,me)}if(d.phase==='final')renderPlayerFinal(d)}
function playerShell(c,dark){app.innerHTML='<main id="playerMain" class="min-h-screen p-4 safe '+(dark?'!bg-red-900':'')+'"><header class="flex items-center justify-between mb-4 gap-2"><img src="'+LOGO+'" class="logo-sm"><div class="flex items-center gap-2"><span data-conn></span>'+langSwitcher()+'</div></header>'+c+'</main>';updateConn()}
function renderPlayerWaiting(msg){playerShell('<section class="panel rounded-[2rem] p-7 text-center min-h-[72vh] flex flex-col justify-center"><h1 class="text-3xl font-black mb-4 text-[#001E62]">'+esc(T('wait'))+'</h1><p class="text-slate-600 text-lg font-bold">'+esc(msg)+'</p><div class="mt-8 rounded-2xl bg-[#F4F7FF] p-5"><p class="font-bold text-slate-600">'+esc(T('yourName'))+'</p><p class="text-3xl font-black text-[#001E62]">'+esc(player.name)+'</p></div><div class="mt-4 rounded-2xl bg-[#F4F7FF] p-5"><p class="font-bold text-slate-600">'+esc(T('livesLeft'))+'</p><p class="mt-2">'+heartsSVG(player.wrong)+'</p><p class="font-black text-[#001E62] mt-1">'+Math.max(0,MAX_WRONG-player.wrong)+' / '+MAX_WRONG+'</p></div></section>')}
function playerQ(d){let qIdx=(d.order&&d.order[d.questionIndex]!==undefined)?d.order[d.questionIndex]:(d.question&&d.question.qIdx);return Q[qIdx]}
function renderPlayerQuestion(d){let q=playerQ(d);if(!q)return;let total=d.totalQuestions||Q.length;playerShell('<section><div class="panel rounded-[2rem] p-5 mb-4"><div class="flex justify-between mb-3 gap-2"><p class="text-[#001E62] font-black">'+esc(T('questionOf'))+' '+(d.questionIndex+1)+' / '+total+'</p><div class="rounded-2xl bg-white text-[#001E62] px-4 py-2 border text-center"><p class="text-xs font-bold">'+esc(T('left'))+'</p><p id="pTime" class="text-3xl font-black">'+d.question.time+'</p></div></div><div class="barwrap h-3 bg-slate-200 rounded-full mb-4"><div id="pBar" class="bar"></div></div><h1 class="text-xl font-black">'+esc(qText(q))+'</h1><div class="flex items-center justify-between mt-4 flex-wrap gap-2"><span class="font-black text-[#001E62]">'+esc(T('livesLeft'))+': '+heartsSVG(player.wrong)+'</span><span class="font-black text-[#001E62]">'+icon('flame','w-5 h-5')+' '+esc(T('streak'))+': '+(player.streak||0)+'</span><span class="font-black text-[#001E62]">'+esc(T('score'))+': '+player.score+'</span></div></div><div class="space-y-3">'+opts(q).map((op,i)=>'<button '+(player.locked?'disabled':'')+' onclick="sendAnswer('+i+')" class="opt btn w-full rounded-3xl p-5 text-left font-black text-lg shadow-xl '+(player.selected===i?'gold':'bg-white text-[#001E62]')+'"><span class="inline-flex mr-4 w-11 h-11 rounded-full bg-[#001E62] text-white items-center justify-center">'+String.fromCharCode(65+i)+'</span>'+esc(op)+'</button>').join('')+'</div><div class="mt-4 panel rounded-2xl p-4 text-center"><p id="sendMsg" class="font-black text-slate-600">'+esc(player.locked?T('sent'):T('choose'))+'</p><p class="mt-2 text-sm text-slate-600 font-bold">'+esc(T('wrongCount'))+': '+player.wrong+' / '+MAX_WRONG+'</p></div></section>')}
function startPlayerTimer(ends,total){clearInterval(playerTimer);cancelAnimationFrame(playerRAF);playerTimer=setInterval(()=>{let left=Math.max(0,Math.ceil((ends-Date.now())/1000)),t=document.getElementById('pTime');if(t)t.textContent=left;if(left<=0)clearInterval(playerTimer)},200);animate('pBar',ends,total,v=>playerRAF=v)}
function vibrate(p){try{if(navigator.vibrate)return navigator.vibrate(p)}catch(e){}}
function sendAnswer(i){if(player.locked)return;vibrate(8);player.selected=i;player.locked=true;pub(base+'/player',{type:'answer',id:player.id,answer:i});document.querySelectorAll('button[onclick^="sendAnswer"]').forEach((b,idx)=>{b.disabled=true;if(idx===i){b.classList.remove('bg-white','text-[#001E62]');b.classList.add('gold')}else b.classList.add('opacity-45')});let m=document.getElementById('sendMsg');if(m)m.textContent=T('sent')}
function renderPlayerResult(d,me){let q=Q[d.result.qIdx];if(!q)return;let ok=me&&me.lastCorrect===true;if(!ok){vibrate([220,80,220,80,320]);setTimeout(()=>{let e=document.getElementById('playerMain');if(e)e.classList.add('shake')},30)}let breakdown=ok?'<div class="rounded-3xl bg-[#F4F7FF] p-4 my-4 text-left"><p class="text-[#001E62] font-black mb-2">'+esc(T('breakdown'))+'</p><div class="flex justify-between font-bold"><span>'+esc(T('basePoints'))+'</span><span>+'+(me.lastBase||0)+'</span></div><div class="flex justify-between font-bold"><span>'+esc(T('speedBonus'))+'</span><span>+'+(me.lastSpeed||0)+'</span></div><div class="flex justify-between font-bold"><span>'+esc(T('streakBonus'))+' ('+esc(T('streak'))+' '+(me.streak||0)+')</span><span>+'+(me.lastStreakBonus||0)+'</span></div><div class="flex justify-between font-black text-[#001E62] text-xl mt-2 pt-2 border-t"><span>'+esc(T('totalGain'))+'</span><span>+'+(me.lastGain||0)+'</span></div></div>':'';playerShell('<section class="panel rounded-[2rem] p-5 text-center"><div class="'+(ok?'text-green-500':'text-red-500')+' mb-4">'+icon(ok?'check':'x','w-20 h-20')+'</div><h1 class="text-4xl font-black '+(ok?'text-green-600':'text-red-600')+' mb-4">'+esc(ok?T('right'):T('wrong'))+'</h1><div class="rounded-3xl gold p-5 mb-4"><p class="font-bold">'+esc(T('correct'))+'</p><p class="text-2xl font-black">'+String.fromCharCode(65+q.c)+'. '+esc(opts(q)[q.c])+'</p></div>'+visual(q.k,aText(q),subText(q))+'<div class="rounded-3xl bg-[#F4F7FF] p-4 my-4 text-left"><p class="text-[#001E62] font-black">'+esc(T('exp'))+'</p><p class="font-bold text-slate-700">'+esc(expText(q))+'</p></div>'+breakdown+'<div class="rounded-3xl bg-[#F4F7FF] p-4"><p class="font-bold text-slate-600">'+esc(T('livesLeft'))+'</p><p class="mt-2">'+heartsSVG(player.wrong)+'</p><p class="text-3xl font-black text-[#001E62]">'+Math.max(0,MAX_WRONG-player.wrong)+' / '+MAX_WRONG+'</p><p class="font-bold text-slate-600 mt-2">'+esc(T('score'))+': '+player.score+'</p></div><p class="mt-4 text-slate-600 font-bold">'+esc(T('next'))+'</p></section>')}
function renderPlayerEliminated(){playerShell('<section class="rounded-[2rem] bg-red-700/90 p-8 text-center min-h-[78vh] flex flex-col justify-center text-white"><h1 class="text-6xl font-black mb-4">'+esc(T('eliminatedTitle'))+'</h1><p class="text-xl font-bold">'+esc(T('wrongCount'))+' '+player.wrong+' / '+MAX_WRONG+'</p><p class="mt-4 font-bold">'+esc(T('score'))+': '+player.score+'</p></section>',true)}
function renderPlayerFinal(d){let rk=d.ranking||[];let myRank=rk.findIndex(p=>p.id===player.id);playerShell('<section class="panel rounded-[2rem] p-6 text-center"><h1 class="text-4xl font-black mb-6 text-[#001E62]">'+esc(T('done'))+'</h1>'+podiumHTML(rk)+'<div class="rounded-3xl gold p-6 mb-6"><p class="font-bold">'+esc(T('score'))+'</p><p class="text-6xl font-black">'+player.score+'</p>'+(myRank>=0?'<p class="font-black mt-2">'+esc(T('yourRank'))+': '+(myRank+1)+'</p>':'')+'</div><div class="space-y-3">'+rk.map((p,i)=>'<div class="rounded-2xl bg-[#F4F7FF] p-4 flex justify-between"><b>'+(i+1)+'. '+esc(p.name)+'</b><b>'+p.score+'</b></div>').join('')+'</div><button onclick="renderHome()" class="btn mt-6 rounded-full blue px-8 py-4 font-black">'+esc(T('backHub'))+'</button></section>')}
</script></body></html>
